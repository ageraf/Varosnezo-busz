name: Build APK

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Aláíró kulcs
        if: env.KEYSTORE_B64 != ''
        run: echo "$KEYSTORE_B64" | base64 -d > release.keystore
      - name: Build
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log
          cp app/build/outputs/apk/debug/app-debug.apk varosnezo-${{ github.run_number }}.apk
      - name: Hibanapló mentése (ci-log ág)
        if: failure()
        run: |
          { grep -E "^e: |error:|What went wrong" -A4 build.log | head -150; echo ----; tail -60 build.log; } > ci-error.txt
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-log
          git rm -rfq --cached .
          git add ci-error.txt
          git commit -qm "CI hiba ${{ github.sha }}"
          git push -f origin ci-log
      - name: Release (letölthető APK)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: varosnezo-${{ github.run_number }}.apk
      - name: Régi kiadások törlése (a legutóbbi 3 marad)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            -q 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName' \
            | xargs -r -n1 gh release delete --cleanup-tag -y
      - name: Hibanapló ág törlése sikeres buildnél
        if: success()
        run: git push origin --delete ci-log || true
